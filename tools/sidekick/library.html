<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Library</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    const library = document.createElement('sidekick-library');
    library.config = {
      base: '/tools/sidekick/library.json',
      plugins: {
        blocks: {
          encodeImages: true,
          viewPorts: [600, 900],
        },
      },
    };
    document.body.prepend(library);
  </script>
</body>
</html>
